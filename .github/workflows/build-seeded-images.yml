name: Build seeded images

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  mexico:
    if: github.repository_owner == 'PIH'
    concurrency:
      group: build-seeded-images-mexico-${{ github.ref }}
      cancel-in-progress: true
    uses: PIH/openmrs-contrib-distro-tools/.github/workflows/build-seeded-image.yml@main
    with:
      image_name: partnersinhealth/ces-emr
      site: mexico
      pih_config: mexico
    secrets: inherit
